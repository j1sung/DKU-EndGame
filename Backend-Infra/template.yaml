AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ChickenGame development backend with EOS Connect token verification

Parameters:
  EosProductId:
    Type: String
    MinLength: 1
    Description: Epic Online Services Product ID
  EosSandboxId:
    Type: String
    MinLength: 1
    Description: Epic Online Services Sandbox ID
  EosDeploymentId:
    Type: String
    MinLength: 1
    Description: Epic Online Services Deployment ID
  EosClientId:
    Type: String
    MinLength: 1
    Description: Epic Online Services server Client ID
  VerifierTimeoutMs:
    Type: Number
    Default: 8000
    MinValue: 1
  VerifierMaxOutputBytes:
    Type: Number
    Default: 65536
    MinValue: 1024

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Tags:
        Project: chickengame
        Environment: dev

  EosClientSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: chickengame/dev/eos-client-secret
      Description: EOS server Client Secret for the ChickenGame development backend
      Tags:
        - Key: Project
          Value: chickengame
        - Key: Environment
          Value: dev

  PlayerProfiles:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: chickengame-dev-player-profiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAtSeconds
        Enabled: true
      Tags:
        - Key: Project
          Value: chickengame
        - Key: Environment
          Value: dev

  MatchmakingTickets:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: chickengame-dev-matchmaking-tickets
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
        - AttributeName: queueKey
          AttributeType: S
        - AttributeName: queueSortKey
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: QueueIndex
          KeySchema:
            - AttributeName: queueKey
              KeyType: HASH
            - AttributeName: queueSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAtSeconds
        Enabled: true
      Tags:
        - Key: Project
          Value: chickengame
        - Key: Environment
          Value: dev

  Matches:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: chickengame-dev-matches
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: deadlineKey
          AttributeType: S
        - AttributeName: deadlineSortKey
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: DeadlineIndex
          KeySchema:
            - AttributeName: deadlineKey
              KeyType: HASH
            - AttributeName: deadlineSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: expiresAtSeconds
        Enabled: true
      Tags:
        - Key: Project
          Value: chickengame
        - Key: Environment
          Value: dev

  MatchmakingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: chickengame-dev-matchmaking-dlq
      MessageRetentionPeriod: 1209600

  MatchmakingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: chickengame-dev-matchmaking
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - MatchmakingDeadLetterQueue
            - Arn
        maxReceiveCount: 5

  AuthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: backend/Dockerfile
      DockerTag: nodejs24-v1
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      FunctionName: chickengame-dev-api
      MemorySize: 512
      Timeout: 15
      PropagateTags: true
      Tags:
        Project: chickengame
        Environment: dev
      Environment:
        Variables:
          EOS_PRODUCT_ID:
            Ref: EosProductId
          EOS_SANDBOX_ID:
            Ref: EosSandboxId
          EOS_DEPLOYMENT_ID:
            Ref: EosDeploymentId
          EOS_CLIENT_ID:
            Ref: EosClientId
          EOS_CLIENT_SECRET_ARN:
            Ref: EosClientSecret
          PLAYER_PROFILES_TABLE:
            Ref: PlayerProfiles
          MATCHMAKING_TICKETS_TABLE:
            Ref: MatchmakingTickets
          MATCHES_TABLE:
            Ref: Matches
          MATCHMAKING_QUEUE_URL:
            Ref: MatchmakingQueue
          EOS_VERIFIER_TIMEOUT_MS:
            Ref: VerifierTimeoutMs
          EOS_VERIFIER_MAX_OUTPUT_BYTES:
            Ref: VerifierMaxOutputBytes
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                Ref: EosClientSecret
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource:
                Fn::GetAtt:
                  - PlayerProfiles
                  - Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - MatchmakingTickets
                  - Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - Fn::GetAtt:
                    - Matches
                    - Arn
                - Fn::Sub: ${Matches.Arn}/index/DeadlineIndex
            - Effect: Allow
              Action: sqs:SendMessage
              Resource:
                Fn::GetAtt:
                  - MatchmakingQueue
                  - Arn
      Events:
        Me:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/me
            Method: GET
        Nickname:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/me/nickname
            Method: POST
        CreateTicket:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/matchmaking/tickets
            Method: POST
        CurrentTicket:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/matchmaking/tickets/current
            Method: GET
        CancelTicket:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/matchmaking/tickets/current
            Method: DELETE
        GetMatch:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/matches/{matchId}
            Method: GET
        RegisterMatchSession:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/matches/{matchId}/session
            Method: POST
        MatchJoined:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/matches/{matchId}/joined
            Method: POST
        MatchStarted:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/matches/{matchId}/started
            Method: POST
        MatchFinished:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/matches/{matchId}/finished
            Method: POST
        MatchLeft:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /v1/matches/{matchId}/left
            Method: POST

  MatchmakingWorker:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: backend/Dockerfile
      DockerTag: nodejs24-worker-v1
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - dist/worker-handler.handler
      Architectures:
        - x86_64
      FunctionName: chickengame-dev-matchmaking-worker
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          PLAYER_PROFILES_TABLE:
            Ref: PlayerProfiles
          MATCHMAKING_TICKETS_TABLE:
            Ref: MatchmakingTickets
          MATCHES_TABLE:
            Ref: Matches
          MATCHMAKING_QUEUE_URL:
            Ref: MatchmakingQueue
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource:
                Fn::GetAtt:
                  - PlayerProfiles
                  - Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - Fn::GetAtt:
                    - MatchmakingTickets
                    - Arn
                - Fn::Sub: ${MatchmakingTickets.Arn}/index/QueueIndex
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - Fn::GetAtt:
                    - Matches
                    - Arn
                - Fn::Sub: ${Matches.Arn}/index/DeadlineIndex
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:SendMessage
              Resource:
                Fn::GetAtt:
                  - MatchmakingQueue
                  - Arn
      Events:
        QueueHints:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
                - MatchmakingQueue
                - Arn
            BatchSize: 1
        RecoverySweep:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

  MatchmakingWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${MatchmakingWorker}
      RetentionInDays: 14

  AuthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AuthFunction}
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: chickengame
        - Key: Environment
          Value: dev

Outputs:
  ApiUrl:
    Description: Development HTTP API base URL
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  ClientSecretArn:
    Description: ARN of the retained EOS Client Secret
    Value:
      Ref: EosClientSecret
  FunctionName:
    Description: Lambda function name
    Value:
      Ref: AuthFunction
